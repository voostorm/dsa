<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1c1e">
  <meta name="description" content="A minimal Python reconstruction puzzle with chat and a runnable editor.">
  <title>DSA Puzzle</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e7e6e8;background:#1d1c1e;font-synthesis:none}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}
    .app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100dvh;width:100%;isolation:isolate}
    .app:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#393939;z-index:2;pointer-events:none}
    .pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
    .chat-pane{background:#1d1c1e;order:1}.work-pane{background:#1d1c1e;order:2}
    .app.swapped .chat-pane{order:2}.app.swapped .work-pane{order:1}
    .pane-header{height:68px;min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px}
    .heading{font-weight:650;font-size:15px;letter-spacing:-.025em}.muted{color:#8a96a8;font-size:12px}
    .connection{display:flex;align-items:center;gap:7px;color:#97a0ad;font-size:12px}
    .connection:before{content:"";width:6px;height:6px;border-radius:50%;background:#c6ccd5}
    .swap-btn{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:36px;height:36px;z-index:4;display:grid;place-items:center;background:#262527;color:#b7b5b9;border:1px solid #393939;border-radius:12px;box-shadow:0 3px 12px #16294a12;font-size:19px;line-height:1;transition:background .15s,transform .15s}
    .swap-btn:hover{background:#323133;transform:translateX(-50%) scale(1.06)}.swap-btn:focus-visible,.piece:focus-visible,.icon-btn:focus-visible,.run-btn:focus-visible{outline:3px solid #9abefa;outline-offset:3px}
    .chat-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:24px 32px 18px;gap:16px}
    .chat-empty{margin:auto;text-align:center;color:#b7b5b9;max-width:310px;padding-bottom:24px}
    .chat-empty .mark{margin:0 auto 20px;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#323133;color:#5877a6;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:20px}
    .chat-empty h1{font-size:21px;line-height:1.3;color:#e7e6e8;letter-spacing:-.04em;font-weight:650;margin:0 0 9px}.chat-empty p{margin:0;font-size:13px;line-height:1.65;color:#b7b5b9}
    .message{max-width:87%;align-self:flex-end;border-radius:15px 15px 4px 15px;background:#323133;padding:12px 15px;color:#e7e6e8;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
    .message img{display:block;width:100%;max-width:310px;max-height:250px;object-fit:contain;border-radius:9px;margin-top:8px}
    .message img:first-child{margin-top:0}.chat-note{align-self:center;text-align:center;color:#b7b5b9;font-size:12px;line-height:1.5;max-width:300px;margin-top:5px}
    .composer-wrap{padding:0 26px 24px}.composer{border:1px solid #393939;background:#262527;border-radius:16px;box-shadow:0 4px 24px #1d314a08;padding:10px}
    .composer textarea{resize:none;border:0;outline:0;background:transparent;width:100%;padding:8px 10px;min-height:64px;max-height:180px;line-height:1.6;font-size:13px;color:#e7e6e8}
    .composer textarea::placeholder{color:#a5afbd}.composer-actions{display:flex;justify-content:space-between;align-items:center;padding:0 3px 1px}
    .icon-btn{display:grid;place-items:center;border:0;background:transparent;color:#b7b5b9;width:34px;height:34px;border-radius:10px;font-size:19px}
    .icon-btn:hover{background:#323133}.send-btn{background:#364d72;color:white;border-radius:11px}.send-btn:hover{background:#2a4163}
    .attachments{display:flex;align-items:center;gap:8px;margin:0 4px 6px;font-size:12px;color:#b7b5b9}
    .attachment-thumb{width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid #393939}.attachment-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:200px}
    .remove-attachment{border:0;background:#323133;color:#b7b5b9;width:23px;height:23px;border-radius:8px}
    .work-scroll{overflow-y:auto;min-height:0;flex:1;padding:8px 32px 30px}
    .editor-shell{border-radius:15px;overflow:hidden;border:1px solid #393939;background:#262527;box-shadow:0 16px 36px #1c304618}
    .editor-top{height:53px;border-bottom:1px solid #393939;display:flex;align-items:center;justify-content:space-between;padding:0 17px 0 22px;color:#9eafc7;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
    .editor-title{display:flex;align-items:center;gap:9px}.file-dot{width:7px;height:7px;border-radius:50%;background:#88b9e8}
    .run-btn{border:0;display:flex;align-items:center;gap:8px;background:#c4f0d9;color:#173d2b;border-radius:9px;padding:9px 13px;font-family:inherit;font-size:12px;font-weight:700}
    .run-btn:hover{background:#a6e7c5}.run-btn:disabled{opacity:.7;cursor:wait}
    .editor-area{height:clamp(300px,47vh,620px);min-height:260px;position:relative;background:#262527}
    .code-font{font:13.5px/26px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;tab-size:4;letter-spacing:0}
    .highlight,.editor-input{position:absolute;inset:0;margin:0;padding:21px 23px;border:0;width:100%;height:100%;white-space:pre;overflow:auto}
    .highlight{pointer-events:none;color:#d4d4d4;scrollbar-width:none}.highlight::-webkit-scrollbar{display:none}
    .editor-input{z-index:1;resize:none;background:transparent;outline:none;color:transparent;-webkit-text-fill-color:transparent;caret-color:#f8fbff;overflow-wrap:normal}
    .editor-input::selection{background:#647da67a}.editor-area.drag-over{background:#323133}
    .editor-area.drag-over:after{content:"Drop to insert line";position:absolute;right:18px;bottom:16px;border-radius:8px;background:#35557c;color:#e9f2ff;font-size:11px;padding:7px 10px;z-index:3;pointer-events:none}
    .drop-guide{position:absolute;left:23px;right:23px;height:2px;background:#8bd9f7;box-shadow:0 0 8px #8bd9f7a0;z-index:3;pointer-events:none;display:none}
    .token-keyword{color:#c586c0}.token-declaration,.token-constant{color:#569cd6}
    .token-function{color:#dcdcaa}.token-type{color:#4dc9b0}
    .token-string{color:#ce9178}.token-comment{color:#83a872}.token-number{color:#b5cea8}
    .feedback{min-height:24px;margin:16px 2px 5px;color:#b7b5b9;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .feedback:empty{min-height:0;margin:0}
    .feedback.success{color:#89d9b0}.feedback.failure{color:#fa98a3}.feedback.loading{color:#9bbdec}
    .pieces{
      display:flex;
      flex-flow:row wrap;
      align-items:flex-start;
      gap:9px;
      margin-top:12px;
      padding:12px;
      min-height:52px;
      border:1px solid #68666c;
      border-radius:12px;
    }
    .pieces > .piece{flex:1 0 auto;justify-content:space-between}
    .piece{width:auto;max-width:100%;display:flex;align-items:center;text-align:left;gap:12px;border:1px solid #393939;background:#262527;color:#d4d4d4;border-radius:9px;padding:10px 13px;font:13px/22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-shadow:0 2px 6px #1e2f4610;cursor:grab;transition:border-color .1s,box-shadow .1s;touch-action:manipulation}
    /* Keep drag grips toward the outer edge of the viewport as the panes swap. */
    .app:not(.swapped) .pieces .piece{flex-direction:row-reverse}
    .app.swapped .pieces .piece{flex-direction:row}
    .piece:hover{border-color:#95b1d2;box-shadow:0 3px 10px #1e2f4618}.piece:active{cursor:grabbing}.piece.dragging{opacity:.35}
    .grip{color:#b4becc;font-size:16px;letter-spacing:-5px;flex:0 0 15px}.piece-code{white-space:pre;overflow-x:auto;scrollbar-width:thin;min-width:0}
    .bank-empty{font-size:12px;color:#9aa6b5;padding:8px 0}
    @media(max-width:750px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr 1fr}.app:before{top:50%;bottom:auto;left:0;right:0;width:auto;height:1px}.pane{min-height:0}.chat-pane{order:1}.work-pane{order:2}.app.swapped .chat-pane{order:2}.app.swapped .work-pane{order:1}.swap-btn{top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px}.swap-btn:hover{transform:translate(-50%,-50%) scale(1.06)}.pane-header{height:52px;min-height:52px;padding:0 19px}.chat-log{padding:12px 18px}.chat-empty{padding:12px 0}.composer-wrap{padding:0 15px 13px}.composer textarea{min-height:42px}.work-scroll{padding:6px 17px 20px}.editor-area{height:260px}.connection{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}

    /* Read-only reconstruction editor; pieces are movable on mouse and touch. */
    .editor-actions{display:flex;align-items:center;gap:12px}
    .reset-btn{font-size:12px;font-weight:600;color:#b3c1d3;border:0;border-radius:8px;background:transparent;padding:8px 5px}
    .reset-btn:hover{color:#ecf3ff;background:#323133}
    .editor-area{overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
    .code-stack{padding:20px 23px;min-height:100%}
    .fixed-line,.assembled-line{height:30px;line-height:30px;white-space:pre}
    .fixed-line{color:#d4d4d4;user-select:none}
    .assembled-line{width:max-content;max-width:none;min-width:0;padding:0 6px;border-radius:6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;color:#d4d4d4;box-sizing:content-box}
    .assembled-line:hover,.assembled-line:focus-visible{background:#323133;outline:none}
    .assembled-line:active{cursor:grabbing}
    .assembled-line.drag-source{opacity:.27}
    .assembled-line .code-text{display:inline-block;pointer-events:none}
    .editor-landing{font:12px/30px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b7b5b9;min-height:30px;user-select:none}
    .editor-landing.has-lines{color:transparent}
    .drop-guide{left:21px;right:21px;border-radius:2px;z-index:3}
    .indent-guide{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #8bd9f7;filter:drop-shadow(0 0 3px #8bd9f790);pointer-events:none;display:none;z-index:3}
    .piece{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .drag-ghost{position:fixed;z-index:1000;pointer-events:none;padding:7px 12px;border:1px solid #9bb6d6;border-radius:8px;background:#323133;color:#d4d4d4;font:13px/22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;box-shadow:0 12px 30px #18283e30;max-width:85vw;overflow:hidden}
    .reset-btn:focus-visible,.assembled-line:focus-visible{outline:2px solid #a9d6fd;outline-offset:1px}
    @media(max-width:750px){.code-stack{padding:17px 16px}.editor-landing{font-size:11px}.editor-actions{gap:5px}.reset-btn{padding:7px 3px}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="pane chat-pane" aria-label="Chat">
      <header class="pane-header"><span class="heading">Chat</span></header>
      <div class="chat-log" id="chat-log" aria-live="polite">
        <div class="chat-empty" id="chat-empty">
          <div class="mark">{ }</div>
          <h1>What are we solving?</h1>
          <p>Ask a question, paste a problem, or attach a screenshot.</p>
        </div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <div class="attachments" id="attachments" hidden></div>
          <textarea id="chat-input" rows="2" placeholder="Message…" aria-label="Chat message"></textarea>
          <div class="composer-actions">
            <div><button type="button" class="icon-btn" id="attach-btn" aria-label="Attach an image" title="Attach an image">＋</button><input id="image-input" type="file" accept="image/*" hidden></div>
            <button class="icon-btn send-btn" type="submit" aria-label="Send message" title="Send message">↑</button>
          </div>
        </form>
      </div>
    </section>
    <section class="pane work-pane" aria-label="Python workspace">
      <div class="work-scroll" id="work-scroll">
        <div class="editor-shell">
          <div class="editor-top">
            <span class="editor-title"><span class="file-dot"></span>solution.py</span>
            <div class="editor-actions"><button class="reset-btn" id="reset-btn" type="button" title="Return all lines to the puzzle bank">↺ Reset</button><button class="run-btn" id="run-btn" type="button"><span aria-hidden="true">▶</span> Run Code</button></div>
          </div>
          <div class="editor-area" id="editor-area" aria-label="Read-only Python puzzle assembly">
            <div class="code-stack" id="code-stack">
              <div class="fixed-line code-font" id="fixed-line"></div>
              <div class="assembled-lines" id="assembled-lines" role="list" aria-label="Placed Python lines"></div>
              <div class="editor-landing" id="editor-landing">drag puzzle pieces here</div>
            </div>
            <div class="drop-guide" id="drop-guide" aria-hidden="true"></div>
            <div class="indent-guide" id="indent-guide" aria-hidden="true"></div>
          </div>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <section class="pieces" id="pieces" aria-label="Puzzle pieces"></section>
      </div>
    </section>
    <button class="swap-btn" id="swap-btn" type="button" aria-label="Swap chat and editor sides" title="Swap sides">⇄</button>
  </main>
  <script>
  (function(){
    "use strict";
    var $ = function(id){return document.getElementById(id);};
    var app=$("app"), area=$("editor-area"), bank=$("pieces");
    var fixed=$("fixed-line"), board=$("assembled-lines"), landing=$("editor-landing"), guide=$("drop-guide"), indentGuide=$("indent-guide"), stack=$("code-stack");
    var feedback=$("feedback"), workScroll=$("work-scroll");
    var signature="def contains_duplicate(nums):";
    var pieces=[
      {id:0,text:"        if num in seen:"},
      {id:1,text:"    return False"},
      {id:2,text:"        seen.add(num)"},
      {id:3,text:"    for num in nums:"},
      {id:4,text:"            return True"},
      {id:5,text:"    seen = set()"}
    ];
    var placed=[], indents={}, active=null, ghost=null, scrollFrame=null, firstTouchRow=null;
    var runWorker=null, timeout=null, runId=0;
    var tests=[
      {args:[[1,2,3,1]],expected:true},
      {args:[[1,2,3,4]],expected:false},
      {args:[[]],expected:false},
      {args:[[5,5]],expected:true},
      {args:[[-1,0,-1]],expected:true},
      {args:[[0]],expected:false}
    ];
    var editor={get value(){return signature+"\n"+placed.map(function(id){return " ".repeat(4*indentLevel(id))+pieceById(id).text.trimStart();}).join("\n");}};
    function pieceById(id){return pieces.find(function(p){return p.id===id;});}
    function defaultIndent(id){return (pieceById(id).text.match(/^ */)[0].length/4)|0;}
    function indentLevel(id){return indents[id]===undefined?defaultIndent(id):indents[id];}
    function indentStep(){var rect=stack.getBoundingClientRect(),style=getComputedStyle(fixed);
      var probe=document.createElement("span");probe.textContent="    ";probe.style.font=style.font;probe.style.whiteSpace="pre";probe.style.position="absolute";probe.style.visibility="hidden";stack.appendChild(probe);var width=probe.getBoundingClientRect().width;probe.remove();return width||32.5;}
    function codeOrigin(){return stack.getBoundingClientRect().left+parseFloat(getComputedStyle(stack).paddingLeft);}
    function snappedLevel(x,offset){return Math.max(1,Math.min(8,Math.round((x-offset-codeOrigin())/indentStep())));}
    function escapeHTML(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
    var pythonTokens=/(?<comment>#[^\n]*)|(?<string>"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(?<declaration>\b(?:def|class)\b)|(?<function>(?<=\bdef\s+)[A-Za-z_]\w*)|(?<type>(?<=\bclass\s+)[A-Za-z_]\w*|\b(?:set|list|dict|int|float|str|bool|tuple|List|Dict|Set|Tuple)\b)|(?<constant>\b(?:True|False|None)\b)|(?<keyword>\b(?:return|if|else|elif|for|while|in|not|and|or|pass|import|from|as|break|continue)\b)|(?<builtin>\b(?:range|len|print|enumerate|max|min)\b)|(?<number>\b\d+\b)/g;
    function colorize(src){
      var out="",pos=0;
      for(var match of src.matchAll(pythonTokens)){
        var kind=Object.keys(match.groups).find(function(key){return match.groups[key]!==undefined;});
        out+=escapeHTML(src.slice(pos,match.index));
        out+='<span class="token-'+(kind==="builtin"?"function":kind)+'">'+escapeHTML(match[0])+'</span>';
        pos=match.index+match[0].length;
      }
      return out+escapeHTML(src.slice(pos));
    }
    function setFeedback(message,kind){feedback.textContent=message;feedback.className="feedback"+(kind?" "+kind:"");}
    function renderBoard(){
      fixed.innerHTML=colorize(signature);board.replaceChildren();
      placed.forEach(function(id,i){
        var piece=pieceById(id),line=document.createElement("div");
        line.className="assembled-line code-font";line.dataset.id=id;line.setAttribute("role","listitem");
        line.style.marginLeft=(4*indentLevel(id))+"ch";
        line.setAttribute("tabindex","0");line.setAttribute("aria-label","Python line "+(i+1)+": "+piece.text.trim()+". Drag to reorder and adjust indentation, right click or press Delete to return to bank.");
        var content=document.createElement("span");content.className="code-text";content.innerHTML=colorize(piece.text.trimStart());
        line.appendChild(content);
        line.addEventListener("pointerdown",function(e){prepareDrag(e,"editor",id);});
        line.addEventListener("contextmenu",function(e){e.preventDefault();cancelDrag();returnPiece(id);});
        line.addEventListener("keydown",function(e){
          var index=placed.indexOf(id);
          if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();returnPiece(id);}
          else if(e.key==="ArrowUp"&&index>0){e.preventDefault();movePiece(id,index-1);focusPiece(id);}
          else if(e.key==="ArrowDown"&&index<placed.length-1){e.preventDefault();movePiece(id,index+1);focusPiece(id);}
        });
        board.appendChild(line);
      });
      landing.classList.toggle("has-lines",placed.length>0);
      bank.replaceChildren();
      var remaining=pieces.filter(function(p){return !placed.includes(p.id);});
      remaining.forEach(function(piece){
        var btn=document.createElement("button");btn.type="button";btn.className="piece";
        btn.setAttribute("aria-label","Drag "+piece.text.trim()+" into the editor");
        var grip=document.createElement("span");grip.className="grip";grip.textContent="⋮⋮";grip.setAttribute("aria-hidden","true");
        var label=document.createElement("span");label.className="piece-code";label.innerHTML=colorize(piece.text.trimStart());
        btn.append(grip,label);
        btn.addEventListener("pointerdown",function(e){prepareDrag(e,"bank",piece.id);});
        // Placement requires a drag (mouse) or touch-and-hold drag (mobile).
        bank.appendChild(btn);
      });
    }
    function focusPiece(id){var line=board.querySelector('[data-id="'+id+'"]');if(line)line.focus();}
    function movePiece(id,index,level){
      var had=placed.includes(id),rest=placed.filter(function(p){return p!==id;});
      if(!had&&rest.length===placed.length&& !pieces.some(function(p){return p.id===id;}))return;
      rest.splice(Math.max(0,Math.min(index,rest.length)),0,id);
      placed=rest;if(level!==undefined)indents[id]=level;renderBoard();setFeedback("","");
    }
    function returnPiece(id){
      if(!placed.includes(id))return;
      placed=placed.filter(function(p){return p!==id;});delete indents[id];renderBoard();setFeedback("","");
    }
    function resetPuzzle(){
      cancelDrag();
      if(runWorker){runWorker.terminate();runWorker=null;clearTimeout(timeout);runId++;$("run-btn").disabled=false;$("run-btn").textContent="▶ Run Code";}
      placed=[];indents={};renderBoard();setFeedback("All pieces returned to the bank.","");
    }
    function over(element,x,y){
      var r=element.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
    }
    function insertIndex(y,excludingId){
      var rows=Array.from(board.children).filter(function(el){return Number(el.dataset.id)!==excludingId;});
      var index=0;for(var i=0;i<rows.length;i++){var r=rows[i].getBoundingClientRect();if(y>=r.top+r.height/2)index++;}
      return index;
    }
    function hideGuides(){
      guide.style.display="none";indentGuide.style.display="none";area.classList.remove("drag-over");
    }
    function showGuide(y,source,id){
      if(!over(area,active.x,active.y)){hideGuides();return;}
      var index=insertIndex(y,source==="editor"?id:null);
      var rows=Array.from(board.children).filter(function(el){return Number(el.dataset.id)!==(source==="editor"?id:null);});
      var anchor=rows[index];
      var top=anchor?anchor.getBoundingClientRect().top:rows.length?rows[rows.length-1].getBoundingClientRect().bottom:fixed.getBoundingClientRect().bottom;
      var rect=area.getBoundingClientRect();
      var level=snappedLevel(active.x,active.grabOffset);
      var targetX=codeOrigin()+level*indentStep();
      /* Both guides intersect exactly at the snapped column and insertion row. */
      guide.style.top=(top-rect.top+area.scrollTop)+"px";
      guide.style.left=(targetX-rect.left+area.scrollLeft)+"px";
      guide.style.right="10px";guide.style.display="block";
      indentGuide.style.left=(targetX-rect.left+area.scrollLeft)+"px";
      indentGuide.style.display="block";
      area.classList.add("drag-over");
    }
    function updateGhost(){
      if(!active||!active.started)return;
      ghost.style.left=(active.x-active.grabOffset)+"px";
      ghost.style.top=(active.y-12)+"px";
      showGuide(active.y,active.source,active.id);
    }
    function dragAutoscroll(){
      scrollFrame=null;if(!active||!active.started)return;
      var r=workScroll.getBoundingClientRect(),y=active.y;
      if(y>=r.top&&y<r.top+56)workScroll.scrollTop-=12;
      else if(y<=r.bottom&&y>r.bottom-56)workScroll.scrollTop+=12;
      updateGhost();scrollFrame=requestAnimationFrame(dragAutoscroll);
    }
    function beginDrag(){
      if(!active||active.started)return;
      active.started=true;ghost=document.createElement("div");ghost.className="drag-ghost";
      ghost.innerHTML=colorize(pieceById(active.id).text.trimStart());document.body.appendChild(ghost);
      if(active.source==="editor"){var src=board.querySelector('[data-id="'+active.id+'"]');if(src)src.classList.add("drag-source");}
      updateGhost();scrollFrame=requestAnimationFrame(dragAutoscroll);
    }
    function cancelDrag(){
      if(active&&active.timer)clearTimeout(active.timer);
      active=null;if(scrollFrame!==null){cancelAnimationFrame(scrollFrame);scrollFrame=null;}
      if(ghost){ghost.remove();ghost=null;}
      board.querySelectorAll(".drag-source").forEach(function(el){el.classList.remove("drag-source");});
      hideGuides();
    }
    function prepareDrag(e,source,id){
      if(e.button!==0||e.isPrimary===false||active)return;
      if(e.pointerType==="mouse")e.preventDefault();
      var grabOffset;
      if(source==="editor"){grabOffset=e.clientX-e.currentTarget.getBoundingClientRect().left;}
      else{
        var label=e.currentTarget.querySelector(".piece-code");
        grabOffset=e.clientX-label.getBoundingClientRect().left;
      }
      var width=pieceById(id).text.trimStart().length*(indentStep()/4);
      grabOffset=Math.max(0,Math.min(width,grabOffset));
      active={pointerId:e.pointerId,source:source,id:id,pointerType:e.pointerType,grabOffset:grabOffset,
        sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,started:false,timer:null};
      if(e.currentTarget.setPointerCapture)try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
      if(e.pointerType==="touch")active.timer=setTimeout(function(){beginDrag();},180);
    }
    window.addEventListener("pointermove",function(e){
      if(!active||e.pointerId!==active.pointerId)return;
      active.x=e.clientX;active.y=e.clientY;
      var distance=Math.hypot(e.clientX-active.sx,e.clientY-active.sy);
      if(!active.started){
        if(active.pointerType==="touch"&&distance>14){cancelDrag();return;}
        if(active.pointerType!=="touch"&&distance>4)beginDrag();
      }
      if(active&&active.started){e.preventDefault();updateGhost();}
    },{passive:false});
    window.addEventListener("pointerup",function(e){
      if(!active||e.pointerId!==active.pointerId)return;
      var snapshot=active,wasDragging=snapshot.started,x=e.clientX,y=e.clientY;
      var inEditor=over(area,x,y),inBank=over(bank,x,y);
      var index=inEditor?insertIndex(y,snapshot.source==="editor"?snapshot.id:null):null;
      var level=inEditor?snappedLevel(x,snapshot.grabOffset):null;
      cancelDrag();
      if(!wasDragging)return;
      if(inEditor)movePiece(snapshot.id,index,level);
      else if(snapshot.source==="editor"&&inBank)returnPiece(snapshot.id);
    });
    window.addEventListener("pointercancel",function(e){if(active&&e.pointerId===active.pointerId)cancelDrag();});
    window.addEventListener("blur",cancelDrag);
    /* Two-finger tap anywhere with the first finger resting on a placed line returns that line. */
    document.addEventListener("touchstart",function(e){
      if(e.touches.length===1){
        var t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY);
        var row=el&&el.closest(".assembled-line");
        firstTouchRow=row?Number(row.dataset.id):null;
      }else if(e.touches.length>=2&&firstTouchRow!==null){
        var id=firstTouchRow;firstTouchRow=null;cancelDrag();returnPiece(id);e.preventDefault();
      }
    },{capture:true,passive:false});
    document.addEventListener("touchend",function(e){if(e.touches.length===0)firstTouchRow=null;},{passive:true});
    $("reset-btn").addEventListener("click",resetPuzzle);
    $("swap-btn").addEventListener("click",function(){app.classList.toggle("swapped");});
    renderBoard();
    var pendingImage=null, pendingURL=null;
    var imageInput=$("image-input"),attachments=$("attachments");
    $("attach-btn").addEventListener("click",function(){imageInput.click();});
    imageInput.addEventListener("change",function(){
      var file=imageInput.files&&imageInput.files[0];if(!file)return;
      if(!file.type.startsWith("image/")){setFeedback("Please choose an image file.","failure");return;}
      if(pendingURL)URL.revokeObjectURL(pendingURL);
      pendingImage=file;pendingURL=URL.createObjectURL(file);
      attachments.hidden=false;attachments.replaceChildren();
      var thumb=document.createElement("img");thumb.src=pendingURL;thumb.alt="Attached image";thumb.className="attachment-thumb";
      var name=document.createElement("span");name.className="attachment-name";name.textContent=file.name;
      var remove=document.createElement("button");remove.type="button";remove.className="remove-attachment";remove.textContent="×";remove.setAttribute("aria-label","Remove image");
      remove.addEventListener("click",function(){clearAttachment();});
      attachments.append(thumb,name,remove);
    });
    function clearAttachment(){pendingImage=null;pendingURL=null;imageInput.value="";attachments.replaceChildren();attachments.hidden=true;}
    var input=$("chat-input"),chat=$("chat-log"),notified=false;
    input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chat-form").requestSubmit();}});
    $("chat-form").addEventListener("submit",function(e){
      e.preventDefault();var text=input.value.trim();if(!text&&!pendingImage)return;
      $("chat-empty")?.remove();
      var bubble=document.createElement("div");bubble.className="message";
      if(text){var body=document.createElement("div");body.textContent=text;bubble.appendChild(body);}
      if(pendingImage){var photo=document.createElement("img");photo.src=pendingURL;photo.alt=pendingImage.name;bubble.appendChild(photo);}
      chat.appendChild(bubble);input.value="";clearAttachment();
      if(!notified){var note=document.createElement("p");note.className="chat-note";note.textContent="Chat is a placeholder. AI responses will work after the API is connected.";chat.appendChild(note);notified=true;}
      chat.scrollTop=chat.scrollHeight;input.focus();
    });
    function runCode(){
      if(runWorker)return;
      var button=$("run-btn");button.disabled=true;button.textContent="Running…";setFeedback("Starting Python. The first run may download its runtime.","loading");
      var id=++runId,worker;
      try{worker=new Worker("./game/py-worker.js");}catch(err){button.disabled=false;button.textContent="▶ Run Code";setFeedback("Could not start Python. Open the app on GitHub Pages over HTTPS.","failure");return;}
      runWorker=worker;
      function finish(){
        if(runWorker!==worker)return false;
        clearTimeout(timeout);worker.terminate();runWorker=null;button.disabled=false;button.textContent="▶ Run Code";return true;
      }
      timeout=setTimeout(function(){if(finish())setFeedback("Execution timed out. Check for an infinite loop, or retry after the runtime loads.","failure");},60000);
      worker.onerror=function(){if(finish())setFeedback("Python could not load. Check your connection and use the hosted HTTPS version.","failure");};
      worker.onmessage=function(e){
        if(e.data.id!==id||!finish())return;
        if(!e.data.ok){setFeedback("Runtime error: "+e.data.error,"failure");return;}
        var output=e.data.output;
        if(output.error){setFeedback(output.error,"failure");return;}
        var passed=0,firstFailure=null;
        tests.forEach(function(test,i){
          var got=output.results[i]||{value:null,error:"No result"};
          var ok=!got.error&&JSON.stringify(got.value)===JSON.stringify(test.expected);
          if(ok)passed++;
          else if(!firstFailure)firstFailure="Input: "+JSON.stringify(test.args)+"\nExpected: "+JSON.stringify(test.expected)+"\nReceived: "+(got.error||JSON.stringify(got.value));
        });
        if(passed===tests.length)setFeedback("✓ All "+tests.length+" tests passed.","success");
        else setFeedback(passed+"/"+tests.length+" tests passed.\n"+firstFailure,"failure");
      };
      worker.postMessage({id:id,code:editor.value,fn:"contains_duplicate",tests:tests.map(function(t){return {args:t.args};})});
    }
    $("run-btn").addEventListener("click",runCode);

  })();
  </script>
</body>
</html>
